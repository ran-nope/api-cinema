name: Check demo API and challenges

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test cinema.test.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
